# Ignition 8.1.55 gateway (official Inductive Automation image)
# Start:  docker compose up -d      Stop: docker compose down
# Web UI: http://localhost:8088
services:
  ignition:
    image: inductiveautomation/ignition:8.1.55
    container_name: ignition-frontend
    hostname: ignition-frontend
    restart: unless-stopped
    ports:
      - "8088:8088"   # HTTP (gateway web UI / Designer / Perspective)
      - "8043:8043"   # HTTPS
      - "8060:8060"   # Gateway Network
    environment:
      ACCEPT_IGNITION_EULA: "Y"
      GATEWAY_ADMIN_USERNAME: ${GATEWAY_ADMIN_USERNAME:-admin}
      GATEWAY_ADMIN_PASSWORD: ${GATEWAY_ADMIN_PASSWORD:-password}
      IGNITION_EDITION: standard
      TZ: Pacific/Auckland
    volumes:
      - ignition-data:/usr/local/bin/ignition/data   # gateway state (named volume = reliable on Windows)
      - ./backups:/backups                           # drop .gwbk files here to restore / export
    networks:
      - default
      - ignition-net
    command: >
      -n ignition-frontend
      -m 2048
      --
      wrapper.java.initmemory=512

volumes:
  ignition-data:

networks:
  ignition-net:
    external: true
